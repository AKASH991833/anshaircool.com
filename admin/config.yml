backend:
  name: github
  repo: AKASH991833/anshaircool.com
  branch: main
local_backend: false
publish: true
media_folder: "media"
public_folder: "/media"
site_url: https://anshaircool.netlify.app
display_url: https://anshaircool.netlify.app
logo_url: https://anshaircool.netlify.app/favicon.svg
collections:
  - name: "website"
    label: "Website content"
    files:
      - label: "Homepage and services"
        name: "homepage"
        file: "content/site.json"
        format: "json"
        fields:
          - {label: "Main headline", name: "heroTitle", widget: "string", hint: "Keep it short and factual."}
          - {label: "Opening paragraph", name: "heroDescription", widget: "text"}
          - {label: "About paragraph", name: "aboutDescription", widget: "text"}
          - {label: "Contact details note", name: "contactNote", widget: "text", hint: "Only replace with business details after they have been verified by the owner."}
          - label: "Services"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Service name", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
