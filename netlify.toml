[build]
  publish = "."
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[redirects]]
  from = "/frontend/admin/*"
  to = "/admin/"
  status = 301
  force = true
[[redirects]]
  from = "/gallery"
  to = "/#services"
  status = 301
[[redirects]]
  from = "/gallery.html"
  to = "/#services"
  status = 301
